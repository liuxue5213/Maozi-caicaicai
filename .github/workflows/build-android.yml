name: Build Android APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  # 手动触发
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json
            server/package-lock.json

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true

      - name: Install shared dependencies
        run: |
          cd shared
          npm install
          npm run build

      - name: Install server dependencies
        run: |
          cd server
          npm install

      - name: Install client dependencies
        run: |
          cd client
          npm install --legacy-peer-deps

      - name: Build Web (for Android WebView fallback)
        run: |
          cd client
          npx expo export --platform web
        env:
          EXPO_PUBLIC_API_URL: ${{ secrets.API_URL }}
          EXPO_PUBLIC_WS_URL: ${{ secrets.WS_URL }}

      - name: Prebuild Android project
        run: |
          cd client
          npx expo prebuild --platform android --no-install
        env:
          EXPO_PUBLIC_API_URL: ${{ secrets.API_URL }}
          EXPO_PUBLIC_WS_URL: ${{ secrets.WS_URL }}

      - name: Create Debug Signing Config
        working-directory: client/android
        run: |
          # 生成 debug keystore 用于签名 release 构建
          keytool -genkeypair -v \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US" \
            -keystore app/debug.keystore 2>&1 || true
          
          # 配置 gradle 使用 debug keystore 签名 release
          if ! grep -q "signingConfigs" app/build.gradle; then
            printf '\nandroid {\n  signingConfigs {\n    release {\n      storeFile file("debug.keystore")\n      storePassword "android"\n      keyAlias "androiddebugkey"\n      keyPassword "android"\n    }\n  }\n  buildTypes {\n    release {\n      signingConfig signingConfigs.release\n    }\n  }\n}\n' >> app/build.gradle
          fi

      - name: Build APK (Release with bundled JS)
        run: |
          cd client/android
          # 修复: 使用 release 构建自动打包 JS bundle，无需 Metro 服务器
          ./gradlew assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: maozi-rps-apk
          path: client/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 90
