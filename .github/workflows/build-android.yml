name: Build Android APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  # 手动触发
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json
            server/package-lock.json

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true

      - name: Install shared dependencies
        run: |
          cd shared
          npm install
          npm run build

      - name: Install server dependencies
        run: |
          cd server
          npm install

      - name: Install client dependencies
        run: |
          cd client
          npm install --legacy-peer-deps

      - name: Build Web (for Android WebView fallback)
        run: |
          cd client
          npx expo export --platform web
        env:
          EXPO_PUBLIC_API_URL: ${{ secrets.API_URL }}
          EXPO_PUBLIC_WS_URL: ${{ secrets.WS_URL }}

      - name: Prebuild Android project
        run: |
          cd client
          npx expo prebuild --platform android --no-install
        env:
          EXPO_PUBLIC_API_URL: ${{ secrets.API_URL }}
          EXPO_PUBLIC_WS_URL: ${{ secrets.WS_URL }}

      - name: Build Debug APK
        run: |
          cd client/android
          ./gradlew assembleDebug --no-daemon

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: rps-debug-apk
          path: client/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      # Release APK (仅 main/master 分支且有签名配置时)
      - name: Build Release APK
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        working-directory: client/android
        run: |
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > app/release.keystore
            
            # 写入签名配置 (避免 heredoc 解析问题)
            printf '\nandroid {\n  signingConfigs {\n    release {\n      storeFile file("release.keystore")\n      storePassword "%s"\n      keyAlias "%s"\n      keyPassword "%s"\n    }\n  }\n  buildTypes {\n    release {\n      signingConfig signingConfigs.release\n    }\n  }\n}\n' \
              "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
              "${{ secrets.ANDROID_KEY_ALIAS }}" \
              "${{ secrets.ANDROID_KEY_PASSWORD }}" >> app/build.gradle
            
            ./gradlew assembleRelease --no-daemon
          else
            echo "No signing config available, skipping release build"
            mkdir -p app/build/outputs/apk/release
            cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/release/app-release.apk
          fi

      - name: Upload Release APK
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@v4
        with:
          name: rps-release-apk
          path: client/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 90
