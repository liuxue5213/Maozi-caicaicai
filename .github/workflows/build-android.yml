name: Build Android APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  # 手动触发
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json
            server/package-lock.json

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true

      - name: Install shared dependencies
        run: |
          cd shared
          npm install
          npm run build

      - name: Install server dependencies
        run: |
          cd server
          npm install

      - name: Install client dependencies
        run: |
          cd client
          npm install --legacy-peer-deps

      - name: Build Web (for Android WebView fallback)
        run: |
          cd client
          npx expo export --platform web
        env:
          EXPO_PUBLIC_API_URL: ${{ secrets.API_URL || 'http://120.48.13.152:60205/api' }}
          EXPO_PUBLIC_WS_URL: ${{ secrets.WS_URL || 'ws://120.48.13.152:60205/ws' }}

      - name: Prebuild Android project
        run: |
          cd client
          npx expo prebuild --platform android --no-install
        env:
          EXPO_PUBLIC_API_URL: ${{ secrets.API_URL || 'http://120.48.13.152:60205/api' }}
          EXPO_PUBLIC_WS_URL: ${{ secrets.WS_URL || 'ws://120.48.13.152:60205/ws' }}

      - name: Build Debug APK
        run: |
          cd client/android
          ./gradlew assembleDebug --no-daemon

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: rps-debug-apk
          path: client/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      # Release APK (仅 main/master 分支且有签名配置时)
      - name: Build Release APK
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        run: |
          cd client/android
          
          # 如果有签名密钥则构建 release
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            # 解码 keystore
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > app/release.keystore
            
            # 配置 signing
            cat >> app/build.gradle <<EOF
            
            android {
              signingConfigs {
                release {
                  storeFile file('release.keystore')
                  storePassword '${{ secrets.ANDROID_KEYSTORE_PASSWORD }}'
                  keyAlias '${{ secrets.ANDROID_KEY_ALIAS }}'
                  keyPassword '${{ secrets.ANDROID_KEY_PASSWORD }}'
                }
              }
              buildTypes {
                release {
                  signingConfig signingConfigs.release
                }
              }
            }
            EOF
            
            ./gradlew assembleRelease --no-daemon
          else
            echo "No signing config, building debug as release artifact"
            cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/release/app-release.apk
          fi
        env:
          EXPO_PUBLIC_API_URL: ${{ secrets.API_URL || 'http://120.48.13.152:60205/api' }}
          EXPO_PUBLIC_WS_URL: ${{ secrets.WS_URL || 'ws://120.48.13.152:60205/ws' }}

      - name: Upload Release APK
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@v4
        with:
          name: rps-release-apk
          path: client/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 90
