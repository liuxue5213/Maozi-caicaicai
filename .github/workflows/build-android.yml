name: Build Android APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  # 手动触发
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json
            server/package-lock.json

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true

      - name: Install shared dependencies
        run: |
          cd shared
          npm install
          npm run build

      - name: Install server dependencies
        run: |
          cd server
          npm install

      - name: Install client dependencies
        run: |
          cd client
          npm install --legacy-peer-deps

      - name: Build Web (for Android WebView fallback)
        run: |
          cd client
          npx expo export --platform web
        env:
          EXPO_PUBLIC_API_URL: ${{ secrets.API_URL || 'http://120.48.13.152:60205/api' }}
          EXPO_PUBLIC_WS_URL: ${{ secrets.WS_URL || 'ws://120.48.13.152:60205/ws' }}

      - name: Prebuild Android project
        run: |
          cd client
          npx expo prebuild --platform android --no-install
        env:
          EXPO_PUBLIC_API_URL: ${{ secrets.API_URL || 'http://120.48.13.152:60205/api' }}
          EXPO_PUBLIC_WS_URL: ${{ secrets.WS_URL || 'ws://120.48.13.152:60205/ws' }}

      - name: Pre-bundle JS for Debug APK
        run: |
          cd client
          # 手动打包 JS bundle 放入 assets (让 debug APK 脱离 Metro)
          mkdir -p android/app/src/main/assets
          npx expo export:embed \
            --platform android \
            --dev false \
            --entry-file index.ts \
            --bundle-output android/app/src/main/assets/index.android.bundle \
            --assets-dest android/app/src/main/res
        env:
          EXPO_PUBLIC_API_URL: ${{ secrets.API_URL || 'http://120.48.13.152:60205/api' }}
          EXPO_PUBLIC_WS_URL: ${{ secrets.WS_URL || 'ws://120.48.13.152:60205/ws' }}

      - name: Build Debug APK
        run: |
          cd client/android
          # 构建 debug APK (无需签名，JS 已预打包)
          ./gradlew assembleDebug --no-daemon

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: maozi-rps-debug-apk
          path: client/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 90
